version: "3.8"
services:
  server:
    build: ./server
    environment:
      - DATABASE_URL=file:/app/data/planner.db
      - PORT=3001
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "8420:80"
    depends_on:
      - server
    restart: unless-stopped
